
name: Build Speak or Spell Mac Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "Speak-or-Spell-by-Wavey-Beat.-main/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Intel Mac DMG
    runs-on: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check project files
        working-directory: Speak-or-Spell-by-Wavey-Beat.-main
        run: |
          test -f package.json
          test -f main.js
          test -f preload.js
          test -f index.html
          test -f renderer.js

      - name: Install dependencies
        working-directory: Speak-or-Spell-by-Wavey-Beat.-main
        run: npm install --no-audit --no-fund

      - name: Build Intel Mac DMG and ZIP
        working-directory: Speak-or-Spell-by-Wavey-Beat.-main
        run: npm run dist:mac

      - name: Verify installer was created
        working-directory: Speak-or-Spell-by-Wavey-Beat.-main
        run: |
          ls -lah dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"

      - name: Upload Mac installer
        uses: actions/upload-artifact@v6
        with:
          name: Speak-or-Spell-by-Wavey-Beat-Intel-Mac
          path: |
            Speak-or-Spell-by-Wavey-Beat.-main/dist/*.dmg
            Speak-or-Spell-by-Wavey-Beat.-main/dist/*.zip
          if-no-files-found: error
          retention-days: 14
