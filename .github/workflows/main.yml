name: Build Speak or Spell Mac Installer
on:
workflow_dispatch:
push:
branches:
- main
permissions:
contents: read
jobs:
build:
runs-on: macos-15
steps:
- name: Check out repository
uses: actions/checkout@v4
- name: Set up Node.js
uses: actions/setup-node@v4
with:
node-version: 22
- name: Inspect project
run: |
echo “Checking repository”
ls -la
find . -maxdepth 3 -name package.json -not -path “./node_modules/”
- name: Install dependencies
if: hashFiles(‘package.json’) != ‘’
run: npm install –no-audit –no-fund
- name: Build Mac installer
run: |
if [ ! -f package.json ]; then
echo “No package.json found. Check the actual project build system.”
exit 1
fi
if node -e “process.exit(require(’./package.json’).scripts?.[‘dist:mac’] ? 0 : 1)”; then
npm run dist:mac
elif node -e “process.exit(require(’./package.json’).scripts?.[‘build’] ? 0 : 1)”; then
npm run build
else
echo “No Mac build script found in package.json.”
exit 1
fi
- name: Verify installer
run: |
find . -type f ( -name “.dmg” -o -name “.pkg” ) -not -path “./node_modules/” -print
find . -type f ( -name “.dmg” -o -name “.pkg” ) -not -path “./node_modules/*
