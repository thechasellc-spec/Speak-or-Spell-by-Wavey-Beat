name: Speak or Spell Mac Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/packaging-and-build-workflow

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Speak-or-Spell-by-Wavey-Beat.-main/package-lock.json

      - name: Locate app
        id: app
        shell: bash
        run: |
          APP_DIR="Speak-or-Spell-by-Wavey-Beat.-main"
          if [ ! -f "$APP_DIR/package.json" ]; then
            echo "::error::Expected app package not found at $APP_DIR/package.json"
            find . -maxdepth 4 -name package.json -print
            exit 1
          fi
          echo "dir=$APP_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify packaged singer engine is included
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          node -e "const p=require('./package.json'); if(!p.build.files.includes('singer-core.js')) { console.error('singer-core.js missing from build.files'); process.exit(1) }"
          test -f singer-core.js
          test -f index.html
          grep -q 'singer-core.js' index.html

      - name: Build Intel Mac DMG and ZIP
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm run dist:mac

      - name: Verify installer outputs
        working-directory: ${{ steps.app.outputs.dir }}
        run: |
          ls -lh dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"

      - name: Upload Intel Mac installer and app archive
        uses: actions/upload-artifact@v4
        with:
          name: Speak-or-Spell-by-Wavey-Beat-Intel-Mac
          path: |
            Speak-or-Spell-by-Wavey-Beat.-main/dist/*.dmg
            Speak-or-Spell-by-Wavey-Beat.-main/dist/*.zip
          if-no-files-found: error
          retention-days: 14
