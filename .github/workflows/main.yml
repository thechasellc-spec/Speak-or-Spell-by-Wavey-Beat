name: Build Speak or Spell Mac Installer

on:
workflow_dispatch:
push:
paths:
- "Speak-or-Spell-by-Wavey-Beat.-main/**"
- ".github/workflows/build-mac-installer.yml"

permissions:
contents: read

jobs:
build:
name: Build Intel Mac DMG
runs-on: macos-13

defaults:
run:
working-directory: Speak-or-Spell-by-Wavey-Beat.-main

steps:
- name: Check out source
uses: actions/checkout@v4

- name: Set up Node.js
uses: actions/setup-node@v4
with:
node-version: "20"

- name: Check required files
run: |
test -f package.json
test -f main.js
test -f preload.js
test -f index.html
test -f renderer.js

- name: Install dependencies
run: npm install --no-audit --no-fund

- name: Build DMG and ZIP for Intel
run: npm run dist:mac

- name: Verify installer files
run: |
ls -lh dist
test -n "$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"

- name: Upload installer
uses: actions/upload-artifact@v4
with:
name: Speak-or-Spell-by-Wavey-Beat-Intel-Mac
path: |
Speak-or-Spell-by-Wavey-Beat.-main/dist/*.dmg
Speak-or-Spell-by-Wavey-Beat.-main/dist/*.zip
if-no-files-found: error
retention-days: 14
