name: Speak or Spell Manual Mac Build

on:
  push:
    branches:
      - feature/local-neural-engine-bridge
    paths:
      - "Speak-or-Spell-by-Wavey-Beat.-main/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Intel Mac DMG
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Speak-or-Spell-by-Wavey-Beat.-main/package.json

      - name: Install dependencies
        working-directory: Speak-or-Spell-by-Wavey-Beat.-main
        run: npm install --no-audit --no-fund

      - name: Build DMG and ZIP
        working-directory: Speak-or-Spell-by-Wavey-Beat.-main
        run: npm run dist:mac

      - name: Verify installer
        working-directory: Speak-or-Spell-by-Wavey-Beat.-main
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          ls -lah dist

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Speak-or-Spell-by-Wavey-Beat-Intel-Mac
          path: |
            Speak-or-Spell-by-Wavey-Beat.-main/dist/*.dmg
            Speak-or-Spell-by-Wavey-Beat.-main/dist/*.zip
          if-no-files-found: error
          retention-days: 14
