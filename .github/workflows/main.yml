name: Speak or Spell Source Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/singing-engine
    paths:
      - "Speak-or-Spell-by-Wavey-Beat.-main/**"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  source-checks:
    name: Validate app source
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: Speak-or-Spell-by-Wavey-Beat.-main
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        working-directory: Speak-or-Spell-by-Wavey-Beat.-main
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js
          node --check singer-core.js

      - name: Verify packaged singing engine
        working-directory: Speak-or-Spell-by-Wavey-Beat.-main
        run: |
          node -e "const p=require('./package.json'); if(!p.build.files.includes('singer-core.js')) { console.error('singer-core.js missing from packaged files'); process.exit(1); }"
          test -f singer-core.js
          grep -q 'singer-core.js' index.html
