name: Neural singer worker tests

on:
  push:
    branches:
      - main
      - feature/local-neural-engine-bridge
    paths:
      - "Speak-or-Spell-by-Wavey-Beat.-main/neural-engine/**"
      - ".github/workflows/neural-worker-tests.yml"
  pull_request:
    paths:
      - "Speak-or-Spell-by-Wavey-Beat.-main/neural-engine/**"
      - ".github/workflows/neural-worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Test worker protocol and missing-engine behavior
        run: python Speak-or-Spell-by-Wavey-Beat.-main/neural-engine/test_worker.py
